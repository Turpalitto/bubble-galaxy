name: Full UI playthrough audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playthrough:
    name: all campaign levels through the real UI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run playthrough
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough-audit
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
